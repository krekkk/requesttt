<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Request Game - Miyu Repacks</title>

<meta
    name="description"
    content="Request game kepada Miyu Repacks."
>

<link
    href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600&display=swap"
    rel="stylesheet"
>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="container">


    <div class="logo">
        MIYU REPacks
    </div>


    <div class="subtitle">
        GAME REQUEST SYSTEM
    </div>


    <div class="request-box">


        <div class="request-title">
            REQUEST GAME
        </div>


        <div class="request-description">

            Punya game yang ingin ditambahkan ke Miyu Repacks?
            Isi data di bawah dengan benar.

        </div>


        <form id="requestForm">


            <div class="form-group">

                <label for="name">
                    NAMA
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Masukkan nama..."
                    required
                >

            </div>


            <div class="form-group">

                <label for="username">
                    USERNAME
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Masukkan username..."
                    required
                >

            </div>


            <div class="form-group">

                <label for="game">
                    NAMA GAME
                </label>

                <input
                    type="text"
                    id="game"
                    name="game"
                    placeholder="Contoh: GTA IV"
                    required
                >

            </div>


            <div class="form-group">

                <label for="platform">
                    PLATFORM
                </label>

                <input
                    type="text"
                    id="platform"
                    name="platform"
                    placeholder="PC / Android / PS2"
                    required
                >

            </div>


            <div class="form-group">

                <label for="reason">
                    ALASAN REQUEST
                </label>

                <textarea
                    id="reason"
                    name="reason"
                    placeholder="Kenapa game ini ingin ditambahkan?"
                ></textarea>

            </div>


            <button
                type="submit"
                class="submit-button"
            >
                KIRIM REQUEST
            </button>


        </form>


    </div>


    <div
        id="successMessage"
        class="success"
    >
        REQUEST BERHASIL DIKIRIM
    </div>


    <a
        href="index.html"
        class="back-button"
    >
        ← KEMBALI
    </a>


    <div class="footer">
        Miyu Repacks 2026
    </div>


</div>


<script>

const form =
    document.getElementById("requestForm");

const successMessage =
    document.getElementById("successMessage");


form.addEventListener("submit", function(event){

    event.preventDefault();

    successMessage.classList.add("show");

    form.reset();

});

</script>


</body>

</html>
