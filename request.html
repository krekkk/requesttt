<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Request Game - Miyu Repacks</title>

<link
    href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600&display=swap"
    rel="stylesheet"
>

<link rel="stylesheet" href="style.css">

</head>


<body>

<div class="container">


    <div class="logo">
        MIYU REPACKS
    </div>


    <div class="subtitle">
        GAME REQUEST SYSTEM
    </div>


    <div class="request-box">

        <div class="request-title">
            REQUEST GAME
        </div>


        <div class="request-description">
            Request game yang ingin ditambahkan ke Miyu Repacks.
        </div>


        <form id="requestForm">


            <div class="form-group">

                <label for="name">
                    NAMA
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Masukkan nama..."
                    maxlength="50"
                    required
                >

            </div>


            <div class="form-group">

                <label for="username">
                    USERNAME
                </label>

                <input
                    type="text"
                    id="username"
                    placeholder="Masukkan username..."
                    maxlength="30"
                    required
                >

            </div>


            <div class="form-group">

                <label for="game">
                    NAMA GAME
                </label>

                <input
                    type="text"
                    id="game"
                    placeholder="Contoh: GTA IV"
                    maxlength="100"
                    required
                >

            </div>


            <div class="form-group">

                <label for="platform">
                    PLATFORM
                </label>

                <select id="platform" required>

                    <option value="">
                        Pilih Platform
                    </option>

                    <option value="PC">
                        PC
                    </option>

                    <option value="Android">
                        Android
                    </option>

                    <option value="PS2">
                        PS2
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label for="reason">
                    ALASAN REQUEST
                </label>

                <textarea
                    id="reason"
                    placeholder="Kenapa game ini ingin ditambahkan?"
                    maxlength="500"
                ></textarea>

            </div>


            <button
                type="submit"
                class="submit-button"
            >
                KIRIM REQUEST
            </button>


        </form>

    </div>


    <div
        id="successMessage"
        class="success"
    >
        REQUEST BERHASIL DISIMPAN
    </div>


    <a
        href="requests.html"
        class="back-button"
    >
        LIHAT REQUEST GAME →
    </a>


    <a
        href="index.html"
        class="back-button"
    >
        ← KEMBALI
    </a>


    <div class="footer">
        Miyu Repacks 2026
    </div>


</div>


<script src="request.js"></script>

</body>

</html>
