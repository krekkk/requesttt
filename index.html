<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Miyu Game Request</title>

<meta
    name="description"
    content="Miyu Game Request - Request game yang ingin ditambahkan ke Miyu Repacks."
>

<link
    rel="icon"
    type="image/png"
    href="logo.jpg"
>

<link
    href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&display=swap"
    rel="stylesheet"
>

<link
    rel="stylesheet"
    href="style.css"
>

</head>


<body>


<header>

    <div class="header-logo">
        MIYU REPACKS
    </div>

    <div class="header-subtitle">
        GAME REQUEST SYSTEM
    </div>

</header>


<main class="container">


    <!-- =========================
         TITLE
    ========================== -->

    <section class="hero">

        <h1>
            REQUEST GAME 
        </h1>

        <p>
            Request game buat masukin ke web miyu repack kalo udh search gugel miyu repack
            
        </p>

    </section>


    <!-- =========================
         FORM
    ========================== -->

    <section class="request-box">


        <div class="section-title">
            KIRIM REQUEST
        </div>


        <form id="requestForm">


            <div class="form-group">

                <label for="name">
                    NAMA
                </label>

                <input
                    type="text"
                    id="name"
                    maxlength="50"
                    placeholder="Masukkan nama..."
                    required
                >

            </div>


            <div class="form-group">

                <label for="username">
                    USERNAME
                </label>

                <input
                    type="text"
                    id="username"
                    maxlength="30"
                    placeholder="Masukkan username..."
                    required
                >

            </div>


            <div class="form-group">

                <label for="game">
                    NAMA GAME
                </label>

                <input
                    type="text"
                    id="game"
                    maxlength="100"
                    placeholder="Contoh: GTA IV"
                    required
                >

            </div>


            <div class="form-group">

                <label for="platform">
                    PLATFORM
                </label>

                <select
                    id="platform"
                    required
                >

                    <option value="">
                        PILIH PLATFORM
                    </option>

                    <option value="PC">
                        PC
                    </option>

                    <option value="Android">
                        Android
                    </option>

                    <option value="PS2">
                        PS2
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label for="reason">
                    ALASAN REQUEST
                </label>

                <textarea
                    id="reason"
                    maxlength="500"
                    placeholder="Kenapa game ini ingin ditambahkan?"
                ></textarea>

            </div>


            <button
                type="submit"
                class="submit-button"
            >
                KIRIM REQUEST
            </button>


        </form>


        <div
            id="successMessage"
            class="success-message"
        >
            REQUEST BERHASIL DISIMPAN
        </div>


    </section>


    <!-- =========================
         VIEW REQUEST
    ========================== -->

    <section class="view-section">

        <a
            href="requests.html"
            class="view-button"
        >
            LIHAT REQUEST GAME →
        </a>

    </section>


</main>


<footer>

    Miyu Repacks © 2026

</footer>


<script src="request.js"></script>

</body>

</html>
